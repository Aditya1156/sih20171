<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Sign Up</title></head>
<body>
  <h1>Create Your Account</h1>
  <form>
    <label for="fullname">Full Name</label>
    <input id="fullname" type="text" autocomplete="name" value="Rahul Gupta">
    <label for="email">Email Address</label>
    <input id="email" type="email" autocomplete="email" value="rahul.gupta123@testmail.in">
    <label for="phone">Phone Number</label>
    <input id="phone" type="tel" autocomplete="tel" value="+91 98765 43210">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="new-password">
    <label for="confirm">Confirm Password</label>
    <input id="confirm" type="password" autocomplete="new-password">
    <button type="submit">Create Account</button>
  </form>
</body>
</html>
