<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Login - TestBank</title></head>
<body>
  <h1>TestBank Login</h1>
  <form>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="Enter your email" value="priya.sharma@example.com">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Enter password">
    <button type="submit">Login</button>
    <a href="/forgot">Forgot password?</a>
  </form>
  <p>Don't have an account? <a href="/signup">Sign up</a></p>
</body>
</html>
