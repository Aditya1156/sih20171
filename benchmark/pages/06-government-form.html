<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Government Service Portal</title></head>
<body>
  <h1>Apply for Passport</h1>
  <form>
    <fieldset>
      <legend>Applicant Information</legend>
      <label for="name">Full Name (as on Aadhaar)</label>
      <input id="name" type="text" value="Deepika Verma">
      <label for="aadhaar">Aadhaar Number</label>
      <input id="aadhaar" type="text" value="9876 5432 1098">
      <label for="pan">PAN</label>
      <input id="pan" type="text" value="BNZPM2501F">
      <label for="dob">Date of Birth</label>
      <input id="dob" type="date" value="1985-11-22">
      <label for="phone">Mobile Number</label>
      <input id="phone" type="tel" value="098-7654-3210">
      <label for="email">Email</label>
      <input id="email" type="email" value="deepika.singh@mock.com">
    </fieldset>
    <fieldset>
      <legend>Address</legend>
      <label for="addr">Present Address</label>
      <textarea id="addr">Block C, Sector 62, Noida, UP 201301</textarea>
      <label for="permanent">Permanent Address</label>
      <textarea id="permanent">Plot 7, Anna Nagar, Chennai, TN 600040</textarea>
    </fieldset>
    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
