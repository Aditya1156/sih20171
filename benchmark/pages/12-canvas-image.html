<head><meta charset="UTF-8"><title>Canvas / Image PII Test</title></head>
<body>

  <canvas id="piiCanvas" width="400" height="200" style="border:1px solid #ccc;"></canvas>

    const ctx = document.getElementById('piiCanvas').getContext('2d');
    ctx.fillStyle = '#ffffff';

    ctx.fillStyle = '#000000';
    ctx.font = '16px Arial';
    ctx.fillText('Name: Deepika Verma', 20, 40);
    ctx.fillText('Aadhaar: 3456 7890 1234', 20, 70);
    ctx.fillText('Email: deepika.singh@mock.com', 20, 100);
    ctx.fillText('Phone: +91 87654 32109', 20, 130);
    ctx.fillText('PAN: KLMNO1234P', 20, 160);
  </script>
